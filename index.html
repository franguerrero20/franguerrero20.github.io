<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Pucón 2026</title>

<!-- iOS: abrir en modo standalone (sin barra de Safari) al agregar a pantalla de inicio -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pucón 2026">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Android/Chrome equivalent -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1618">

<!-- OneSignal: notificaciones push (requiere agregarlo a pantalla de inicio en iOS 16.4+) -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal){
    await OneSignal.init({
      appId: "6802f243-107a-4423-9329-d9300c48ef35",
    });
  });
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fjalla+One&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#0f1618;
  --bg-elev:#182225;
  --bg-elev-2:#1f2b2e;
  --line:#2a3b3d;
  --ember:#e2572a;
  --ember-soft:rgba(226,87,42,0.14);
  --glacial:#4fb3a6;
  --glacial-soft:rgba(79,179,166,0.14);
  --gold:#d9a441;
  --gold-soft:rgba(217,164,65,0.14);
  --text:#f3efe6;
  --text-dim:#93a4a3;
  --text-faint:#5f7274;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding-bottom:calc(40px + env(safe-area-inset-bottom));
}

/* HERO */
.hero{
  position:relative;
  padding:calc(28px + env(safe-area-inset-top)) 20px 22px;
  overflow:hidden;
  border-bottom:1px solid var(--line);
  background:
    radial-gradient(ellipse at 20% 0%, rgba(226,87,42,0.10), transparent 55%),
    radial-gradient(ellipse at 85% 10%, rgba(79,179,166,0.10), transparent 50%),
    var(--bg);
}
.hero svg.range{
  position:absolute;
  left:0; right:0; bottom:-2px;
  width:100%; height:64px;
  opacity:0.9;
}
.eyebrow{
  font-size:11px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--glacial);
  font-weight:600;
  margin:0 0 6px;
}
h1.title{
  font-family:'Fjalla One',sans-serif;
  font-weight:400;
  font-size:44px;
  letter-spacing:0.01em;
  line-height:0.95;
  margin:0 0 8px;
  color:var(--text);
}
h1.title span{color:var(--ember);}
.hero-cta{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12.5px;
  font-weight:600;
  color:var(--text);
  background:var(--bg-elev);
  border:1px solid var(--line);
  padding:7px 12px;
  border-radius:20px;
  cursor:pointer;
  position:relative;
  z-index:2;
}
.hero-cta:active{background:var(--bg-elev-2);}
.hero-cta-primary{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12.5px;
  font-weight:700;
  padding:8px 14px;
  border-radius:20px;
  cursor:pointer;
  position:relative;
  z-index:2;
}
.hero-cta-primary:active{opacity:0.85;}
.hero-cta-primary.cta-gastos{
  background:linear-gradient(var(--gold-soft), var(--gold-soft)), var(--bg-elev);
  border:1px solid rgba(217,164,65,0.4);
  color:var(--gold);
}
.hero-cta-primary.cta-pendientes{
  background:linear-gradient(var(--glacial-soft), var(--glacial-soft)), var(--bg-elev);
  border:1px solid rgba(79,179,166,0.4);
  color:var(--glacial);
}
.hero-ctas{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  position:relative;
  z-index:2;
}

/* DAY RAIL */
.rail-wrap{
  position:sticky; top:0; z-index:20;
  padding-top:env(safe-area-inset-top);
  background:rgba(15,22,24,0.94);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.rail{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px 16px;
  scrollbar-width:none;
}
.rail::-webkit-scrollbar{display:none;}
.day-pill{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:58px;
  padding:8px 4px 7px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--bg-elev);
  cursor:pointer;
  transition:border-color .15s, background .15s, transform .1s;
  user-select:none;
}
.day-pill:active{transform:scale(0.96);}
.day-pill .num{
  font-family:'Fjalla One',sans-serif;
  font-size:20px;
  line-height:1;
  color:var(--text);
}
.day-pill .dow{
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:0.05em;
  color:var(--text-faint);
  margin-top:3px;
}
.day-pill .dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--text-faint);
  margin-top:5px;
}
.day-pill.active{
  background:var(--ember-soft);
  border-color:var(--ember);
}
.day-pill.active .num{color:var(--ember);}
.day-pill.active .dot{background:var(--ember);}

/* DAY HEADER */
.day-panel{display:none; padding:22px 18px 8px;}
.day-panel.active{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

.day-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:4px;
}
.day-head h2{
  font-family:'Fjalla One',sans-serif;
  font-weight:400;
  font-size:24px;
  margin:0;
  color:var(--text);
}
.day-tag{
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:0.08em;
  font-weight:600;
  color:var(--bg);
  background:var(--glacial);
  padding:4px 9px;
  border-radius:20px;
  white-space:nowrap;
}
.day-tag.ember{background:var(--ember);}
.day-loc{
  font-size:13px;
  color:var(--text-dim);
  margin:2px 0 22px;
}

/* TIMELINE */
.timeline{
  position:relative;
  padding-left:26px;
}
.timeline::before{
  content:"";
  position:absolute;
  left:7px; top:6px; bottom:6px;
  width:2px;
  background:repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 11px);
}
.item{
  position:relative;
  margin-bottom:18px;
}
.item::before{
  content:"";
  position:absolute;
  left:-26px; top:3px;
  width:14px; height:14px;
  border-radius:50%;
  background:var(--bg-elev-2);
  border:2px solid var(--glacial);
}
.item.ember::before{border-color:var(--ember);}
.item-card{
  background:var(--bg-elev);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  cursor:pointer;
  transition:border-color .15s, background .15s;
}
.item-card:active{background:var(--bg-elev-2);}
.item-card:hover{border-color:var(--text-faint);}
.item-top{
  display:flex;
  align-items:flex-start;
  gap:10px;
}
.item-icon{font-size:18px; line-height:1.3;}
.item-body{flex:1; min-width:0;}
.item-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.item-title{
  font-size:14.5px;
  font-weight:600;
  color:var(--text);
  margin:0 0 2px;
}
.info-chip{
  flex:0 0 auto;
  width:19px;height:19px;
  border-radius:50%;
  border:1px solid var(--text-faint);
  color:var(--text-faint);
  font-size:11px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
}
.item-meta{
  font-size:12px;
  color:var(--gold);
  font-weight:500;
  margin:0 0 2px;
}
.item-note{
  font-size:12.5px;
  color:var(--text-dim);
  margin:2px 0 0;
  line-height:1.4;
}
.maps-link{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:11px;
  font-weight:600;
  color:var(--glacial);
  text-decoration:none;
  background:var(--glacial-soft);
  border:1px solid rgba(79,179,166,0.35);
  padding:4px 9px;
  border-radius:20px;
  margin-top:8px;
  position:relative;
  z-index:2;
}
.maps-link:active{background:rgba(79,179,166,0.28);}
.sublist{
  list-style:none;
  margin:8px 0 0;
  padding:0 0 0 4px;
  border-top:1px dashed var(--line);
  padding-top:8px;
  position:relative;
  z-index:2;
}
.sublist li{
  font-size:12.5px;
  color:var(--text-dim);
  padding:2px 0 2px 14px;
  position:relative;
  display:flex;
  align-items:center;
  gap:6px;
  justify-content:space-between;
}
.sublist li::before{
  content:"";
  position:absolute;
  left:0; top:9px;
  width:5px; height:5px;
  border-radius:50%;
  background:var(--glacial);
}
.sublist li span.sub-name{flex:1;}
.sub-pin{
  flex:0 0 auto;
  font-size:13px;
  text-decoration:none;
  opacity:0.85;
  padding:3px 6px;
}

.group-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:2px;
}
.group-box{
  background:var(--bg-elev);
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 12px;
  cursor:pointer;
  transition:border-color .15s, background .15s;
}
.group-box:active{background:var(--bg-elev-2);}
.group-label{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--text-faint);
  font-weight:700;
  margin:0 0 6px;
}
.group-box .item-title{font-size:13.5px;}

.day-nav{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:26px 0 4px;
}
.nav-btn{
  flex:1;
  text-align:center;
  padding:12px;
  border-radius:12px;
  background:var(--bg-elev);
  border:1px solid var(--line);
  color:var(--text-dim);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}
.nav-btn:active{background:var(--bg-elev-2);}
.nav-btn.disabled{opacity:0.35; pointer-events:none;}

/* MODAL */
.overlay{
  position:fixed; inset:0;
  background:rgba(6,10,11,0.72);
  backdrop-filter:blur(2px);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
}
.overlay.open{display:flex; animation:fadeBg .18s ease;}
@keyframes fadeBg{from{opacity:0;} to{opacity:1;}}
.sheet{
  width:100%;
  max-width:480px;
  max-height:82vh;
  overflow-y:auto;
  overscroll-behavior:contain;
  background:var(--bg-elev);
  border:1px solid var(--line);
  border-bottom:none;
  border-radius:20px 20px 0 0;
  padding:10px 20px calc(28px + env(safe-area-inset-bottom));
  animation:slideUp .22s ease;
}
@media (min-width:520px){
  .overlay{align-items:center;}
  .sheet{border-radius:18px; border-bottom:1px solid var(--line); max-height:80vh;}
}
@keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{
  width:36px; height:4px; border-radius:3px;
  background:var(--line);
  margin:6px auto 14px;
}
.sheet-head{
  display:flex; align-items:flex-start; gap:12px;
  margin-bottom:6px;
}
.sheet-icon{
  font-size:26px;
  flex:0 0 auto;
}
.sheet-title{
  font-family:'Fjalla One',sans-serif;
  font-weight:400;
  font-size:21px;
  margin:0 0 3px;
  color:var(--text);
}
.sheet-meta{
  font-size:12.5px;
  color:var(--gold);
  font-weight:600;
  margin:0;
}
.sheet-close{
  flex:0 0 auto;
  width:28px; height:28px;
  border-radius:50%;
  background:var(--bg-elev-2);
  border:1px solid var(--line);
  color:var(--text-dim);
  font-size:14px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
.sheet-action{
  flex:0 0 auto;
  width:28px; height:28px;
  border-radius:50%;
  background:var(--bg-elev-2);
  border:1px solid var(--line);
  color:var(--text-dim);
  font-size:14px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
.sheet-action:active{border-color:var(--gold);}
.sheet-note{
  font-size:13px;
  color:var(--text-dim);
  margin:10px 0 0;
  line-height:1.5;
}
.sheet-maps{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12.5px;
  font-weight:600;
  color:var(--bg);
  background:var(--glacial);
  text-decoration:none;
  padding:8px 14px;
  border-radius:20px;
  margin-top:12px;
}
.sheet-section{margin-top:18px;}
.sheet-section-title{
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:0.08em;
  font-weight:700;
  color:var(--glacial);
  margin:0 0 8px;
}
.sheet-section-title.warn{color:var(--ember);}
.sheet-section-title.outfit{color:var(--gold);}
.tip-list{list-style:none; margin:0; padding:0;}
.tip-list li{
  font-size:13.5px;
  color:var(--text);
  line-height:1.45;
  padding:6px 0 6px 20px;
  position:relative;
  border-bottom:1px solid var(--line);
}
.tip-list li:last-child{border-bottom:none;}
.tip-list li::before{
  content:"›";
  position:absolute; left:2px; top:6px;
  color:var(--glacial);
  font-weight:700;
}
.steps-list{list-style:none; counter-reset:step; margin:0; padding:0;}
.steps-list li{
  font-size:13.5px;
  color:var(--text);
  line-height:1.45;
  padding:5px 0 15px 30px;
  position:relative;
  counter-increment:step;
}
.steps-list li::before{
  content:counter(step);
  position:absolute; left:0; top:3px;
  width:20px; height:20px;
  border-radius:50%;
  background:var(--glacial-soft);
  color:var(--glacial);
  font-size:11px;
  font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.pack-list{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:7px;}
.pack-list li{
  font-size:12.5px;
  color:var(--text);
  background:var(--glacial-soft);
  border:1px solid rgba(79,179,166,0.35);
  padding:5px 10px;
  border-radius:20px;
}
.outfit-list{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:7px;}
.outfit-list li{
  font-size:12.5px;
  color:var(--text);
  background:var(--gold-soft);
  border:1px solid rgba(217,164,65,0.4);
  padding:5px 10px;
  border-radius:20px;
}
.place-list{list-style:none; margin:0; padding:0;}
.place-list li{
  display:flex; align-items:center; justify-content:space-between;
  font-size:13px; color:var(--text);
  padding:7px 0;
  border-bottom:1px solid var(--line);
}
.place-list li:last-child{border-bottom:none;}
.place-pin{
  font-size:12px; color:var(--glacial); text-decoration:none; font-weight:600;
  white-space:nowrap;
}
.no-info{
  font-size:13px;
  color:var(--text-faint);
  padding:14px 0 4px;
}
.notes-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.notes-row{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--bg-elev-2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 12px;
  text-decoration:none;
  color:var(--text);
  cursor:pointer;
  font:inherit;
  text-align:left;
  width:100%;
}
.notes-row:active{border-color:var(--text-faint);}
.notes-icon{font-size:18px; flex:0 0 auto;}
.notes-title{flex:1; min-width:0; font-size:13.5px; font-weight:600;}
.notes-arrow{flex:0 0 auto; color:var(--glacial); font-size:14px;}
.apps-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.apps-row{
  display:flex;
  align-items:flex-start;
  gap:10px;
  background:var(--bg-elev-2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 12px;
  text-decoration:none;
  color:var(--text);
}
.apps-row:active{border-color:var(--text-faint);}
.apps-icon{font-size:20px; flex:0 0 auto; margin-top:1px;}
.apps-body{flex:1; min-width:0;}
.apps-title{font-size:13.5px; font-weight:600; margin:0 0 2px;}
.apps-desc{font-size:12px; color:var(--text-dim); line-height:1.4; margin:0;}
.apps-arrow{flex:0 0 auto; color:var(--glacial); font-size:14px; margin-top:2px;}
.balance-list{list-style:none; margin:0; padding:0;}
.balance-list li{
  display:flex; align-items:center; justify-content:space-between;
  font-size:13px; color:var(--text);
  padding:7px 0;
  border-bottom:1px solid var(--line);
}
.balance-list li:last-child{border-bottom:none;}
.balance-amt{font-weight:600;}
.balance-amt.pos{color:var(--glacial);}
.balance-amt.neg{color:var(--ember);}
.balance-amt.zero{color:var(--text-faint); font-weight:500;}
.section-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  cursor:pointer;
}
.section-toggle{
  flex:0 0 auto;
  width:26px;
  height:26px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text-dim);
  background:var(--bg-elev-2);
  border:1px solid var(--line);
  font-size:13px;
  transition:transform .15s ease;
}
.section-toggle.expanded{transform:rotate(180deg);}
.balance-summary{
  font-size:14.5px;
  font-weight:700;
  margin:2px 0 0;
}
.balance-summary.pos{color:var(--glacial);}
.balance-summary.neg{color:var(--ember);}
.balance-summary.zero{color:var(--text-faint); font-weight:500;}
.balance-summary-who{color:var(--text-faint); font-weight:500; font-size:0.8em;}
.settle-list{list-style:none; margin:0; padding:0;}
.settle-list li{
  display:flex; align-items:center; justify-content:space-between;
  font-size:13px; color:var(--text);
  padding:7px 0;
  border-bottom:1px solid var(--line);
}
.settle-list li:last-child{border-bottom:none;}
.settle-right{display:flex; align-items:center; gap:8px;}
.settle-amt{font-weight:600; color:var(--gold);}
.settle-btn{
  font-size:11px; font-weight:700;
  color:var(--bg);
  background:var(--gold);
  border:none;
  padding:5px 10px;
  border-radius:20px;
  cursor:pointer;
}
.settle-btn:active{opacity:0.85;}
.reporte-note{font-size:11.5px; color:var(--text-faint); line-height:1.45; margin:0 0 10px;}
.reporte-totales{
  display:flex; justify-content:space-between; gap:10px;
  background:var(--bg-elev-2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 11px;
  margin:0 0 10px;
  font-size:12.5px;
  color:var(--text-dim);
}
.reporte-totales b{color:var(--text); font-weight:700;}
.reporte-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.reporte-card{
  background:var(--bg-elev-2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
}
.reporte-card.mine{border-color:var(--gold);}
.reporte-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  padding-bottom:7px;
  border-bottom:1px solid var(--line);
  margin-bottom:6px;
}
.reporte-name{font-size:13.5px; font-weight:700; color:var(--text);}
.reporte-yo{font-size:10px; font-weight:700; color:var(--gold); margin-left:5px;}
.reporte-total{font-size:14px; font-weight:700; color:var(--gold); white-space:nowrap;}
.reporte-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  font-size:12px; color:var(--text-dim);

let scrollLockY = 0;
new MutationObserver(() => {
  const isOpen = overlay.classList.contains('open');
  const isLocked = document.body.style.position === 'fixed';
  if(isOpen && !isLocked){
    scrollLockY = window.scrollY;
    document.body.style.position = 'fixed';
    document.body.style.top = `-${scrollLockY}px`;
    document.body.style.width = '100%';
  } else if(!isOpen && isLocked){
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.width = '';
    window.scrollTo(0, scrollLockY);
  }
}).observe(overlay, { attributes: true, attributeFilter: ['class'] });

  let html = `

    ${maps?`<a class="sheet-maps" href="${mapsUrl(maps)}" target="_blank" rel="noopener">📍 Ver en Maps</a>`:''}
  `;

  const hasTips = tips && tips.length;
  const hasOutfit = outfit && outfit.length;
  const hasPack = pack && pack.length;
  const hasSub = sub && sub.length;
  const hasLinks = links && links.length;
  const hasSteps = steps && steps.length;
  const hasApps = apps && apps.length;

  if(hasSteps){
    html += `<div class="sheet-section">
      <ol class="steps-list">${steps.map(s=>`<li>${s}</li>`).join('')}</ol>
    </div>`;
  }
  if(hasTips){
    html += `<div class="sheet-section">
      <p class="sheet-section-title warn">Tener en cuenta</p>
      <ul class="tip-list">${tips.map(t=>`<li>${t}</li>`).join('')}</ul>
    </div>`;
  }
  if(hasOutfit){
    html += `<div class="sheet-section">
      <p class="sheet-section-title outfit">Indumentaria recomendada</p>
      <ul class="outfit-list">${outfit.map(o=>`<li>${o}</li>`).join('')}</ul>
    </div>`;
  }
  if(hasPack){
    html += `<div class="sheet-section">
      <p class="sheet-section-title">Qué llevar</p>
      <ul class="pack-list">${pack.map(p=>`<li>${p}</li>`).join('')}</ul>
    </div>`;
  }
  if(hasSub){
    html += `<div class="sheet-section">
      <p class="sheet-section-title">Lugares de la etapa</p>
      <ul class="place-list">${sub.map(s=>`<li>${s.name}${s.maps?`<a class="place-pin" href="${mapsUrl(s.maps)}" target="_blank" rel="noopener">Ver en Maps</a>`:''}</li>`).join('')}</ul>
    </div>`;
  }
  if(hasLinks){
    html += `<div class="sheet-section">
      <ul class="notes-list">${links.map(n=>{
        const href = n.url ? n.url : (n.phone ? 'tel:'+n.phone : '#');
        const extAttrs = n.url ? ' target="_blank" rel="noopener"' : '';
        return `<li><a class="notes-row" href="${href}"${extAttrs}>
          <span class="notes-icon">${n.icon||'📎'}</span>
          <span class="notes-title">${n.title}</span>
          <span class="notes-arrow">${n.phone?'📞':'↗'}</span>
        </a></li>`;
      }).join('')}</ul>
    </div>`;
  }
  if(hasApps){
    html += `<div class="sheet-section">
      <ul class="apps-list">${apps.map(a=>`<li><a class="apps-row" href="${a.url}" target="_blank" rel="noopener">
        <span class="apps-icon">${a.icon||'📱'}</span>

        <span class="apps-arrow">↗</span>
      </a></li>`).join('')}</ul>
    </div>`;
  }
  if(!hasTips && !hasOutfit && !hasPack && !hasSub && !hasLinks && !hasSteps && !hasApps && !maps){
    html += `<p class="no-info">Sin notas adicionales para esta actividad.</p>`;
  }

  sheet.innerHTML = html;
  sheet.dataset.view = 'detail';
  overlay.classList.add('open');
}

function updateCountdown(){
  const el = document.getElementById('countdown');
  if(!el) return;
  const target = new Date(2026, 7, 7, 19, 0, 0);
  const tripEnd = new Date(2026, 7, 16, 23, 59, 59);
  const now = new Date();

  if(now < target){
    const diff = target - now;
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const secs = Math.floor((diff % 60000) / 1000);
    const pad = n => String(n).padStart(2,'0');
    el.textContent = `Faltan ${days}d ${pad(hours)}h ${pad(mins)}m ${pad(secs)}s`;
  } else if(now <= tripEnd){
    el.textContent = 'Tamo activo';
  } else {
    el.textContent = '7 – 16 de agosto';
  }
}
updateCountdown();
setInterval(updateCountdown, 1000);

// creadoEn puede llegar como Timestamp de Firestore, como {seconds}, o como
// null durante el instante en que serverTimestamp() todavía no volvió del
// servidor. En ese caso no mostramos nada y se completa solo al confirmarse.
function fmtFecha(ts){
  if(!ts) return '';
  let d = null;
  if(typeof ts.toDate === 'function') d = ts.toDate();
  else if(ts instanceof Date) d = ts;
  else if(typeof ts === 'number') d = new Date(ts);
  else if(typeof ts.seconds === 'number') d = new Date(ts.seconds * 1000);
  if(!d || isNaN(d.getTime())) return '';
  const fecha = d.toLocaleDateString('es-UY', { day:'numeric', month:'short' });
  const hora = d.toLocaleTimeString('es-UY', { hour:'2-digit', minute:'2-digit', hour12:false });
  return `${fecha} · ${hora}`;
}

function esc(str){
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function computeUnifiedBalances(expenses){
  const balances = {};
  PEOPLE.forEach(p => balances[p] = 0);
  expenses.forEach(e => {
    const currency = e.moneda || 'CLP';
    const monto = toUYU(Number(e.monto) || 0, currency);
    const entre = (e.entre && e.entre.length) ? e.entre : PEOPLE;
    const share = monto / entre.length;
    if(balances[e.pagadoPor] !== undefined) balances[e.pagadoPor] += monto;
    entre.forEach(p => { if(balances[p] !== undefined) balances[p] -= share; });
  });
  return balances;
}

function computeTotalsByCurrency(expenses){
  const totals = {};
  expenses.forEach(e => {
    const currency = e.moneda || 'CLP';
    totals[currency] = (totals[currency] || 0) + (Number(e.monto) || 0);
  });
  return totals;
}

// Desglose por persona, todo convertido a $U. Separa los gastos reales de
// los pagos entre personas (esSaldo), que no son consumo sino transferencias.
function computeReports(expenses){
  const rep = {};
  PEOPLE.forEach(p => rep[p] = { puso:0, consumo:0, pago:0, recibio:0 });
  expenses.forEach(e => {
    const monto = toUYU(Number(e.monto) || 0, e.moneda || 'CLP');
    const entre = (e.entre && e.entre.length) ? e.entre : PEOPLE;
    const share = monto / entre.length;
    if(e.esSaldo){
      if(rep[e.pagadoPor]) rep[e.pagadoPor].pago += monto;
      entre.forEach(p => { if(rep[p]) rep[p].recibio += share; });
    } else {
      if(rep[e.pagadoPor]) rep[e.pagadoPor].puso += monto;
      entre.forEach(p => { if(rep[p]) rep[p].consumo += share; });
    }
  });
  // Coincide con computeUnifiedBalances: lo que puso menos lo que le tocó.
  PEOPLE.forEach(p => {
    const r = rep[p];
    r.balance = r.puso + r.pago - r.consumo - r.recibio;
    r.desembolso = r.puso + r.pago - r.recibio;
  });
  return rep;
}

// Greedy debt simplification: matches the biggest debtor with the biggest
// creditor each round, so the group ends up with the fewest transfers needed.
function computeSettlements(balances){
  const creditors = [];
  const debtors = [];
  Object.entries(balances).forEach(([name, amt]) => {
    const rounded = Math.round(amt);
    if(rounded > 0) creditors.push({name, amt: rounded});
    else if(rounded < 0) debtors.push({name, amt: -rounded});
  });
  creditors.sort((a,b)=>b.amt-a.amt);
  debtors.sort((a,b)=>b.amt-a.amt);

  const settlements = [];
  let i=0, j=0;
  while(i<debtors.length && j<creditors.length){
    const debtor = debtors[i];
    const creditor = creditors[j];
    const amount = Math.min(debtor.amt, creditor.amt);
    if(amount > 0) settlements.push({from: debtor.name, to: creditor.name, amount});
    debtor.amt -= amount;
    creditor.amt -= amount;
    if(debtor.amt === 0) i++;
    if(creditor.amt === 0) j++;
  }
  return settlements;
}

function renderGastosView(){
  const editingExpense = editingId ? expensesCache.find(x => x.id === editingId) : null;
  const totalsByCurrency = computeTotalsByCurrency(expensesCache);
  const currenciesUsed = Object.keys(totalsByCurrency);

  const totalHtml = currenciesUsed.length
    ? currenciesUsed.map(c => money(totalsByCurrency[c], c)).join(' · ')
    : money(0, 'CLP');

  const unifiedBalances = computeUnifiedBalances(expensesCache);
  const balanceRows = PEOPLE.map(p=>{
    const b = Math.round(unifiedBalances[p]||0);
    const cls = b>0 ? 'pos' : (b<0 ? 'neg' : 'zero');
    const label = b>0 ? `le deben ${money(b, 'UYU')}` : (b<0 ? `debe ${money(-b, 'UYU')}` : 'al día');
    return `<li><span>${p}</span><span class="balance-amt ${cls}">${label}</span></li>`;
  }).join('');
  const settlements = computeSettlements(unifiedBalances);
  const settleHtml = settlements.length
    ? `<ul class="settle-list">${settlements.map(s=>`<li>
        <span class="settle-names">${s.from} → ${s.to}</span>
        <span class="settle-right">
          <span class="settle-amt">${money(s.amount, 'UYU')}</span>
          <button type="button" class="settle-btn" onclick="saldarDeuda('${s.from}','${s.to}',${s.amount})">Saldar</button>
        </span>
      </li>`).join('')}</ul>`
    : `<p class="no-info">Todos al día.</p>`;
  const balanceSectionsHtml = expensesCache.length
    ? `<ul class="balance-list">${balanceRows}</ul><p class="gastos-label">Quién le paga a quién</p>${settleHtml}`
    : `<p class="no-info">Todavía no hay gastos cargados.</p>`;

  const myBalance = Math.round(unifiedBalances[miPersona] || 0);
  const summaryCls = myBalance>0 ? 'pos' : (myBalance<0 ? 'neg' : 'zero');
  const summaryText = !expensesCache.length
    ? 'Todavía no hay gastos cargados.'
    : (myBalance>0 ? `Te deben ${money(myBalance,'UYU')}` : (myBalance<0 ? `Debés ${money(-myBalance,'UYU')}` : 'Estás al día'));
  const balanceTitle = balanceCollapsed ? 'Balance' : 'Balance (convertido a $U, tipo de cambio aprox.)';

  const chipsHtml = PEOPLE.map(p=>`<button type="button" class="gastos-chip${splitSelection.has(p)?' selected':''}" onclick="toggleSplit('${p}', this)">${p}</button>`).join('');
  const currentPagador = editingExpense ? editingExpense.pagadoPor : miPersona;
  const currentMoneda = editingExpense ? (editingExpense.moneda || 'CLP') : 'CLP';
  const payerOptions = PEOPLE.map(p=>`<option value="${p}"${p===currentPagador?' selected':''}>${p}</option>`).join('');
  const currencyOptions = CURRENCIES.map(c=>`<option value="${c}"${c===currentMoneda?' selected':''}>${CURRENCY_FLAG[c]} - ${c}</option>`).join('');
  const descValue = editingExpense ? esc(editingExpense.descripcion || '') : '';
  const montoValue = editingExpense ? editingExpense.monto : '';

  const listHtml = expensesCache.length ? expensesCache.map(e=>{
    const monto = Number(e.monto) || 0;
    const currency = e.moneda || 'CLP';
    const actionsHtml = `<div class="gasto-actions">
        <button type="button" class="gasto-edit" onclick="editGasto('${e.id}')">✏️</button>
        <button type="button" class="gasto-delete" onclick="deleteGasto('${e.id}')">🗑️</button>
      </div>`;
    const fecha = fmtFecha(e.creadoEn);
    const fechaHtml = fecha ? `<p class="gasto-fecha">${fecha}</p>` : '';
    if(e.esSaldo){
      return `<li class="gasto-row">
        <div class="gasto-row-main">
          <p class="gasto-desc">💸 ${e.pagadoPor} le pagó a ${(e.entre||[])[0]||''}</p>
          <p class="gasto-meta">${money(monto, currency)}</p>
          ${fechaHtml}
        </div>
        ${actionsHtml}
      </li>`;
    }
    const entreTxt = (e.entre && e.entre.length === PEOPLE.length) ? 'todos' : (e.entre||[]).join(', ');
    return `<li class="gasto-row">
      <div class="gasto-row-main">
        <p class="gasto-desc">${e.descripcion || '(sin descripción)'}</p>
        <p class="gasto-meta">Pagó ${e.pagadoPor} · ${money(monto, currency)} · entre ${entreTxt}</p>
        ${fechaHtml}
      </div>
      ${actionsHtml}
    </li>`;
  }).join('') : `<p class="no-info">Todavía no hay gastos cargados.</p>`;

  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <span class="sheet-icon">💸</span>
      <div class="item-body">
        <p class="sheet-title">Split</p>
        <p class="sheet-meta">Total: ${totalHtml}</p>
      </div>
      <div class="sheet-action" onclick="openReportes()" title="Reportes">📊</div>
      <div class="sheet-close" onclick="closeDetail()">✕</div>
    </div>

    <div class="sheet-section">
      <div class="section-header" onclick="toggleBalance()">
        <p class="sheet-section-title">${balanceTitle}</p>
        <span class="section-toggle${balanceCollapsed ? '' : ' expanded'}">▾</span>
      </div>
      ${balanceCollapsed ? `<p class="balance-summary ${summaryCls}">${summaryText}${expensesCache.length ? ` <span class="balance-summary-who">· ${miPersona}</span>` : ''}</p>` : balanceSectionsHtml}
    </div>

    <div class="sheet-section">
      <div class="section-header" onclick="toggleAddForm()">
        <p class="sheet-section-title">${editingId ? 'Editar gasto' : 'Agregar gasto'}</p>
        <span class="section-toggle${addFormCollapsed ? '' : ' expanded'}">▾</span>
      </div>
      ${addFormCollapsed ? '' : `<div class="gastos-form">
        <p class="gastos-label">Pagó</p>
        <select id="gasto-pagador" class="gastos-input">${payerOptions}</select>
        <input type="text" id="gasto-desc" class="gastos-input" placeholder="Descripción (ej: Supermercado)" value="${descValue}">
        <div class="gastos-row-inline">
          <input type="number" id="gasto-monto" class="gastos-input" placeholder="Monto" inputmode="numeric" value="${montoValue}">
          <select id="gasto-moneda" class="gastos-input gastos-moneda">${currencyOptions}</select>
        </div>
        <p class="gastos-label">Se divide entre</p>
        <div class="gastos-chips">${chipsHtml}</div>
        <button type="button" class="gastos-submit" onclick="submitGasto()">${editingId ? 'Guardar cambios' : 'Agregar gasto'}</button>
        ${editingId ? `<button type="button" class="gastos-cancel" onclick="cancelEdit()">Cancelar edición</button>` : ''}
      </div>`}
    </div>

    <div class="sheet-section">
      <div class="section-header" onclick="toggleMovimientos()">
        <p class="sheet-section-title">Movimientos</p>
        <span class="section-toggle${movimientosCollapsed ? '' : ' expanded'}">▾</span>
      </div>
      ${movimientosCollapsed ? '' : `<ul class="gastos-list">${listHtml}</ul>`}
    </div>
  `;
  sheet.dataset.view = 'gastos';
}

window.openGastos = function(){
  editingId = null;
  splitSelection = new Set(PEOPLE);
  renderGastosView();
  overlay.classList.add('open');
};

function renderReportesView(){
  const reports = computeReports(expensesCache);
  const gastoTotal = PEOPLE.reduce((sum, p) => sum + reports[p].consumo, 0);
  const cards = PEOPLE
    .slice()
    .sort((a,b) => reports[b].consumo - reports[a].consumo)
    .map(p => {
      const r = reports[p];
      const bal = Math.round(r.balance);
      const balCls = bal>0 ? 'pos' : (bal<0 ? 'neg' : 'zero');
      const balTxt = bal>0 ? `le deben ${money(bal,'UYU')}` : (bal<0 ? `debe ${money(-bal,'UYU')}` : 'al día');
      const extraRows = [
        r.pago >= 1 ? `<div class="reporte-row"><span>Pagos que hizo</span><span>${money(r.pago,'UYU')}</span></div>` : '',
        r.recibio >= 1 ? `<div class="reporte-row"><span>Pagos que recibió</span><span>${money(r.recibio,'UYU')}</span></div>` : ''
      ].join('');
      return `<li class="reporte-card${p===miPersona?' mine':''}">
        <div class="reporte-head">
          <span class="reporte-name">${p}${p===miPersona?'<span class="reporte-yo">VOS</span>':''}</span>
          <span class="reporte-total">${money(r.consumo,'UYU')}</span>
        </div>
        <div class="reporte-row"><span>Puso de su bolsillo</span><span>${money(r.puso,'UYU')}</span></div>
        ${extraRows}
        <div class="reporte-row final"><span>Balance</span><span class="${balCls}">${balTxt}</span></div>
      </li>`;
    }).join('');

  const bodyHtml = expensesCache.length
    ? `<p class="reporte-note">El número grande es lo que <b>gastó</b> cada uno de verdad: su parte del consumo. "Puso" es la plata que adelantó. Todo convertido a $U, tipo de cambio aprox.</p>
       <div class="reporte-totales">
         <span>Total del viaje <b>${money(gastoTotal,'UYU')}</b></span>
         <span>Promedio <b>${money(gastoTotal/PEOPLE.length,'UYU')}</b></span>
       </div>
       <ul class="reporte-list">${cards}</ul>`
    : `<p class="no-info">Todavía no hay gastos cargados.</p>`;

  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <span class="sheet-icon">📊</span>
      <div class="item-body">
        <p class="sheet-title">Reportes</p>
        <p class="sheet-meta">${expensesCache.length ? `Gastaste ${money(reports[miPersona].consumo,'UYU')} · ${miPersona}` : 'Split'}</p>
      </div>
      <div class="sheet-action" onclick="openGastos()" title="Volver a Split">←</div>
      <div class="sheet-close" onclick="closeDetail()">✕</div>
    </div>

    <div class="sheet-section">${bodyHtml}</div>
  `;
  sheet.dataset.view = 'reportes';
}

window.openReportes = function(){
  renderReportesView();
  overlay.classList.add('open');
};

window.toggleSplit = function(name, btn){
  if(splitSelection.has(name)) splitSelection.delete(name); else splitSelection.add(name);
  btn.classList.toggle('selected');
};

window.submitGasto = async function(){
  const descEl = document.getElementById('gasto-desc');
  const montoEl = document.getElementById('gasto-monto');
  const pagador = document.getElementById('gasto-pagador').value;
  const moneda = document.getElementById('gasto-moneda').value;
  const desc = descEl.value.trim();
  const monto = Number(montoEl.value);
  const entre = Array.from(splitSelection);

  if(!desc || !monto || monto<=0){
    alert('Completá la descripción y un monto válido.');
    return;
  }
  if(entre.length===0){
    alert('Elegí entre quiénes se divide el gasto.');
    return;
  }

  const data = { descripcion: desc, monto, moneda, pagadoPor: pagador, entre };
  const wasEditing = !!editingId;
  const submitBtn = document.querySelector('.gastos-submit');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Guardando...'; }

  try {
    if(wasEditing){
      await updateDoc(doc(db, 'expenses', editingId), data);
    } else {
      await addDoc(expensesCol, { ...data, creadoEn: serverTimestamp() });
      const entreTxt = entre.length === PEOPLE.length
        ? 'todos'
        : entre.length === 1
          ? entre[0]
          : entre.slice(0, -1).join(', ') + ' y ' + entre[entre.length - 1];
      sendPushNotification('💸 Nuevo gasto', `${pagador} cargó ${money(monto, moneda)} · ${desc} · entre ${entreTxt}`);
    }
    setWhoAmI(pagador);
    editingId = null;
    splitSelection = new Set(PEOPLE);
    renderGastosView();
    showToast(wasEditing ? '✅ Cambios guardados' : '✅ Gasto agregado');
  } catch(err){
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = wasEditing ? 'Guardar cambios' : 'Agregar gasto'; }
    showToast('⚠️ No se pudo guardar, probá de nuevo');
  }
};

window.editGasto = function(id){
  const e = expensesCache.find(x => x.id === id);
  if(!e) return;
  editingId = id;
  addFormCollapsed = false;
  splitSelection = new Set((e.entre && e.entre.length) ? e.entre : PEOPLE);
  renderGastosView();
  document.getElementById('gasto-pagador').scrollIntoView({block:'center'});
};

window.cancelEdit = function(){
  editingId = null;
  splitSelection = new Set(PEOPLE);
  renderGastosView();
};

window.saldarDeuda = async function(from, to, amount){
  if(!confirm(`¿Confirmás que ${from} le pagó ${money(amount,'UYU')} a ${to}?`)) return;
  try {
    await addDoc(expensesCol, {
      descripcion: `Pago: ${from} a ${to}`,
      monto: amount,
      moneda: 'UYU',
      pagadoPor: from,
      entre: [to],
      esSaldo: true,
      creadoEn: serverTimestamp()
    });
    sendPushNotification('✅ Deuda saldada', `${from} liquidó deuda con ${to} · ${money(amount, 'UYU')}`);
    showToast('💸 Deuda saldada');
  } catch(err){
    showToast('⚠️ No se pudo registrar el pago, probá de nuevo');
  }
};

window.deleteGasto = async function(id){
  if(!confirm('¿Borrar este gasto?')) return;
  try {
    await deleteDoc(doc(db, 'expenses', id));
    showToast('🗑️ Gasto eliminado');
  } catch(err){
    showToast('⚠️ No se pudo eliminar, probá de nuevo');
  }
};

onSnapshot(query(expensesCol, orderBy('creadoEn','desc')), snap => {
  expensesCache = snap.docs.map(d => ({id:d.id, ...d.data()}));
  if(sheet.dataset.view === 'gastos') renderGastosView();
  else if(sheet.dataset.view === 'reportes') renderReportesView();
});

function renderPendientesView(){
  const sorted = [...todosCache].sort((a,b) => (a.hecho===b.hecho) ? 0 : (a.hecho ? 1 : -1));
  const listHtml = sorted.length ? sorted.map(t => `
    <li class="todo-row${t.hecho ? ' done' : ''}">
      <span class="todo-check" onclick="toggleTodo('${t.id}', ${!!t.hecho}, this)">${t.hecho ? '✅' : '⬜'}</span>
      <span class="todo-text">${esc(t.texto || '')}</span>
      <button type="button" class="todo-delete" onclick="deleteTodo('${t.id}')">🗑️</button>
    </li>
  `).join('') : `<p class="no-info">Todavía no hay notas.</p>`;

  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <span class="sheet-icon">📝</span>
      <div class="item-body">
        <p class="sheet-title">Notas</p>
      </div>
      <div class="sheet-close" onclick="closeDetail()">✕</div>
    </div>

    <div class="sheet-section">
      <div class="todo-form">
        <input type="text" id="todo-input" class="gastos-input" placeholder="Nueva nota..." onkeydown="if(event.key==='Enter'){addTodo();}">
        <button type="button" class="gastos-submit todo-add-btn" onclick="addTodo()">Agregar</button>
      </div>
    </div>

    <div class="sheet-section">
      <ul class="todo-list">${listHtml}</ul>
    </div>
  `;
  sheet.dataset.view = 'pendientes';
}

window.openPendientes = function(){
  renderPendientesView();
  overlay.classList.add('open');
};

window.addTodo = async function(){
  const input = document.getElementById('todo-input');
  const texto = input.value.trim();
  if(!texto) return;
  const btn = document.querySelector('.todo-add-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Guardando...'; }
  try {
    await addDoc(todosCol, { texto, hecho: false, creadoEn: serverTimestamp() });
    sendPushNotification('📝 Nueva nota', texto);
    renderPendientesView();
    showToast('✅ Nota agregada');
  } catch(err){
    if(btn){ btn.disabled = false; btn.textContent = 'Agregar'; }
    showToast('⚠️ No se pudo agregar, probá de nuevo');
  }
};

window.toggleTodo = async function(id, currentDone, el){
  const row = el ? el.closest('.todo-row') : null;
  const nowDone = !currentDone;
  if(el) el.textContent = nowDone ? '✅' : '⬜';
  if(row) row.classList.toggle('done', nowDone);
  try {
    await updateDoc(doc(db, 'todos', id), { hecho: nowDone });
  } catch(err){
    if(el) el.textContent = currentDone ? '✅' : '⬜';
    if(row) row.classList.toggle('done', currentDone);
    showToast('⚠️ No se pudo actualizar, probá de nuevo');
  }
};

window.deleteTodo = async function(id){
  if(!confirm('¿Borrar esta nota?')) return;
  try {
    await deleteDoc(doc(db, 'todos', id));
    showToast('🗑️ Nota eliminada');
  } catch(err){
    showToast('⚠️ No se pudo eliminar, probá de nuevo');
  }
};

onSnapshot(query(todosCol, orderBy('creadoEn','asc')), snap => {
  todosCache = snap.docs.map(d => ({id:d.id, ...d.data()}));
  if(sheet.dataset.view === 'pendientes') renderPendientesView();
});

onSnapshot(doc(db, 'meta', 'app'), snap => {
  const data = snap.data();
  if(!data || typeof data.version !== 'number') return;
  if(data.version <= APP_VERSION) return;

  // Evita un loop de recargas si por algún motivo la página servida sigue
  // sin coincidir después de recargar una vez (ej. el deploy de Pages
  // todavía no propagó el HTML nuevo).
  const alreadyTried = Number(sessionStorage.getItem('reloadedForVersion') || 0);
  if(alreadyTried >= data.version) return;
  sessionStorage.setItem('reloadedForVersion', String(data.version));

  showToast('🔄 Hay una versión nueva, actualizando...');
  setTimeout(() => hardReload(), 900);
});
</script>
